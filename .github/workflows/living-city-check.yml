name: Living City preview checks

on:
  pull_request:
    paths:
      - "living-city/**"
      - "tools/smoke_living_city.mjs"
      - ".github/workflows/living-city-check.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check preview JavaScript
        run: node --check living-city/app.js && node --check tools/smoke_living_city.mjs
      - name: Boot and exercise the preview
        run: |
          npm install --no-save jsdom
          node tools/smoke_living_city.mjs
